name: build-gx
run-name: ${{ github.actor }} is building GX files

on:
  workflow_dispatch:
    inputs:
      device_type:
        description: Target SDK architecture
        required: true
        default: arm
        type: choice
        options:
          - arm
          - aarch64

concurrency:
  group: build-gx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gx-files:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select GX SDK target
        id: select-target
        run: |
          DEVICE_TYPE=arm
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.device_type }}" ]; then
              DEVICE_TYPE="${{ inputs.device_type }}"
          fi

          echo "DEVICE_TYPE=${DEVICE_TYPE}" >> "$GITHUB_ENV"
          echo "device_type=${DEVICE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "Building GX target: ${DEVICE_TYPE}"

      - name: Install host dependencies
        run: |
          sudo apt-get update -yq
          sudo apt-get install -y \
              build-essential \
              ca-certificates \
              cmake \
              curl \
              git \
              lsb-release \
              python3 \
              xz-utils \
              zip

      - name: Install or update Venus OS SDK
        run: |
          bash scripts/build-gx-install-requirements.sh

      - name: Build GX binaries
        run: |
          bash scripts/build-gx.sh

      - name: Upload GX artifact
        uses: actions/upload-artifact@v4
        with:
          name: venus-gx-${{ steps.select-target.outputs.device_type }}
          path: build-gx_files_to_copy
          retention-days: 5
          compression-level: 1

      - name: Release - ZIP GX files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build-gx_files_to_copy
          zip -r ../venus-gx-${{ steps.select-target.outputs.device_type }}.zip .

      - name: Release - Create release with GX files
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: venus-gx-${{ steps.select-target.outputs.device_type }}.zip
